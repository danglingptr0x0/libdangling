name: codeql
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '29 4 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    permissions:
      contents: read
      security-events: write
    steps:
      - name: packages
        run: pacman -Syu --noconfirm --needed git cmake nasm pkgconf curl pipewire clang
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v4
        with:
          languages: c-cpp
          build-mode: manual
      - name: build
        run: |
          cmake -S . -B build -DCMAKE_C_COMPILER=clang -DLDG_WITH_GPU=OFF
          cmake --build build -j "$(nproc)"
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:c-cpp
